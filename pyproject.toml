[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbs-vector"
version = "1.2.0"
description = "High-performance, local RAG search engine and MCP stdio server for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lancedb==0.30.2",
    "loguru>=0.7.3",
    "markdown-it-py>=4.0.0",
    "mcp>=1.27.0",
    "mlx-embeddings>=0.1.0",
    "numpy>=2.4.4",
    "polars==1.40.0",
    "pyarrow==24.0.0",
    "pydantic-settings>=2.14.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "sqlglot>=27.0.0",
    "tantivy==0.25.1",
    # transformers 5.13.0 broke AutoTokenizer.register(str, ...), which mlx-lm 0.31.3
    # (still the latest release) relies on at import time. transformers 5.13.1 fixed the
    # regression, so only that single release needs excluding.
    "transformers>=5.0,!=5.13.0",
    "typer>=0.15.1",
    "types-pyyaml>=6.0.12.20260408",
]

[project.scripts]
dbs-vector = "dbs_vector.cli:app"

[project.optional-dependencies]
sql = [
    "duckdb>=1.2.0",
]
api = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "poethepoet>=0.44.0",
    "pytest-asyncio>=1.3.0",
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dbs_vector"]

[tool.poe.tasks]
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=src/dbs_vector -v"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
typecheck = "mypy src/"
# Convenience spot-check with Astral's `ty` (pre-1.0, NOT gated in `check`).
# Uses its own `# ty: ignore[rule]` suppressions, not `# type: ignore`/`# pyright: ignore`.
ty.cmd = "uvx ty check src/"
clean.shell = """
rm -rf .mypy_cache .pytest_cache .ruff_cache .coverage htmlcov dist build
find . -type d -name '__pycache__' -exec rm -rf {} +
"""
check = ["format", "lint", "typecheck", "test"]
# Reproduces CI locally: hide gitignored runtime config (config.yaml) so the
# checks see exactly what a clean GitHub checkout sees, then restore it. In CI
# config.yaml is absent, so the hide is a no-op — this stays the CI entrypoint.
github-release-test.help = "Run `check` as CI sees it (config.yaml hidden, then restored)."
github-release-test.shell = """
restore() { [ -f config.yaml.release-test-hidden ] && mv config.yaml.release-test-hidden config.yaml; }
trap restore EXIT
[ -f config.yaml ] && mv config.yaml config.yaml.release-test-hidden
uv run poe check
rc=$?
exit "$rc"
"""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]  # pycodestyle, pyflakes, bugbear, pyupgrade, isort
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end tests requiring external resources",
]

[[tool.mypy.overrides]]
module = [
    "lancedb",
    "lancedb.*",
    "pyarrow",
    "pyarrow.*",
    "duckdb",
    "duckdb.*",
    "mlx_embeddings",
    "mlx_embeddings.*",
    "sqlglot",
    "sqlglot.*"
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true
