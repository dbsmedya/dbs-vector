[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbs-vector"
version = "1.7.0"
description = "High-performance, local RAG search engine and MCP stdio server for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
# Every range is capped at the next major. Twice now a release has shipped broken
# because an uncapped `>=` admitted a breaking upstream version that CI never saw:
# CI installs from the lockfile, users resolve fresh from these constraints. The
# caps stop breaking majors; the `fresh-resolution` CI job catches the rest.
dependencies = [
    "lancedb==0.36.0",
    "loguru>=0.7.3,<1",
    "markdown-it-py>=4.0.0,<5",
    "mdit-py-plugins>=0.6.0,<0.7",
    # mcp 2.0 removed mcp.server.fastmcp (FastMCP is now mcp.server.mcpserver.MCPServer).
    "mcp>=1.27.0,<2",
    "mlx-embeddings>=0.1.0,<0.2",
    "mlx==0.32.0",
    "numpy>=2.4.4,<3",
    "pathspec>=1.0.4,<2",
    "polars==1.40.0",
    "pyarrow==24.0.0",
    "pydantic-settings>=2.14.0,<3",
    "pydantic>=2.13.3,<3",
    "pyyaml>=6.0.3,<7",
    "starlette>=0.40,<1",
    # transformers 5.13.0 broke AutoTokenizer.register(str, ...), which mlx-lm 0.31.3
    # (still the latest release) relies on at import time. transformers 5.13.1 fixed the
    # regression, so only that single release needs excluding.
    "transformers>=5.0,!=5.13.0,<6",
    "typer>=0.15.1,<1",
    "types-pyyaml>=6.0.12.20260408",
    "uvicorn>=0.30,<1",
    "watchdog>=6.0.0,<7",
]

[project.scripts]
dbs-vector = "dbs_vector.cli:app"

[project.optional-dependencies]
sql = [
    "duckdb>=1.2.0",
]
api = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "poethepoet>=0.44.0",
    "pytest-asyncio>=1.3.0",
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dbs_vector"]

[tool.poe.tasks]
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=src/dbs_vector -v"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
typecheck = "mypy src/"
# Convenience spot-check with Astral's `ty` (pre-1.0, NOT gated in `check`).
# Uses its own `# ty: ignore[rule]` suppressions, not `# type: ignore`/`# pyright: ignore`.
ty.cmd = "uvx ty check src/"
clean.shell = """
rm -rf .mypy_cache .pytest_cache .ruff_cache .coverage htmlcov dist build
find . -type d -name '__pycache__' -exec rm -rf {} +
"""
check = ["format", "lint", "typecheck", "test"]
# Reproduces CI locally: hide gitignored runtime config (config.yaml) so the
# checks see exactly what a clean GitHub checkout sees, then restore it. In CI
# config.yaml is absent, so the hide is a no-op — this stays the CI entrypoint.
github-release-test.help = "Run `check` as CI sees it (config.yaml hidden, then restored)."
github-release-test.shell = """
restore() { [ -f config.yaml.release-test-hidden ] && mv config.yaml.release-test-hidden config.yaml; }
trap restore EXIT
[ -f config.yaml ] && mv config.yaml config.yaml.release-test-hidden
uv run poe check
rc=$?
exit "$rc"
"""
# Run before opening any PR. `uv sync --frozen` (what CI and `poe check` use)
# installs the pinned lockfile, but users get a fresh resolution from the
# pyproject constraints — that gap shipped two broken releases. This re-resolves
# everything to the newest versions pyproject allows and runs the full gate
# against it, mirroring the `fresh-resolution` CI job.
refresh-deps.help = "Pre-PR gate: re-resolve all deps to newest allowed, then run the CI checks."
refresh-deps.shell = """
uv lock --upgrade
uv sync
uv run poe github-release-test
"""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]  # pycodestyle, pyflakes, bugbear, pyupgrade, isort
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end tests requiring external resources",
]

[[tool.mypy.overrides]]
module = [
    "lancedb",
    "lancedb.*",
    "pyarrow",
    "pyarrow.*",
    "duckdb",
    "duckdb.*",
    "mlx",
    "mlx.*",
    "mlx_embeddings",
    "mlx_embeddings.*"
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true
